<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pidx · Tree Index RAG</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b1f24;--muted:#646d78;--line:#e2e5ea;--accent:#2457d6;--accent-soft:#e8eefc;--hl:#fff3c4;--ok:#1f8a4c;--warn:#b26a00;--bad:#c0392b}
@media (prefers-color-scheme: dark){:root{--bg:#111418;--panel:#191d23;--ink:#e6e9ee;--muted:#98a1ad;--line:#2a3039;--accent:#7aa2ff;--accent-soft:#1f2a44;--hl:#4a3f12;--ok:#4cc38a;--warn:#e0a040;--bad:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header span{color:var(--muted);font-size:12px}
header nav{margin-left:auto;display:flex;gap:4px}
header nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:4px 10px;border-radius:6px}
header nav a:hover{background:var(--accent-soft);color:var(--accent)}
header nav a.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.sugg{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.sugg .lbl{font-size:12px;color:var(--muted)}
.chip{display:flex;gap:8px;align-items:baseline;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;cursor:pointer;line-height:1.4}
.chip:hover{border-color:var(--accent)}
.chip b{flex:none;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 6px}
.why{font-size:12px;color:var(--muted);border-left:3px solid var(--accent);padding:4px 8px;margin:8px 0;background:var(--accent-soft);border-radius:0 4px 4px 0}
main{display:grid;grid-template-columns:260px minmax(300px,1fr) minmax(360px,1.3fr);gap:12px;padding:12px;height:calc(100vh - 49px)}
@media (max-width:1000px){main{grid-template-columns:1fr;height:auto}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:0}
section h2{font-size:13px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.scroll{overflow:auto;padding:8px 12px;flex:1}
.doc{padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.doc:hover{background:var(--accent-soft)}
.doc.sel{border-color:var(--accent);background:var(--accent-soft)}
.doc .n{font-weight:600;word-break:break-all}
.doc .m{font-size:12px;color:var(--muted)}
.st-completed{color:var(--ok)}.st-processing,.st-queued{color:var(--warn)}.st-failed{color:var(--bad)}
.up{padding:10px 12px;border-bottom:1px solid var(--line)}
.up input{width:100%;font-size:12px}
.tn{padding:2px 0}
.tn .row{display:flex;gap:6px;align-items:baseline;cursor:pointer;border-radius:4px;padding:2px 4px}
.tn .row:hover{background:var(--accent-soft)}
.tn .row.hit{background:var(--hl)}
.tn .id{font:11px ui-monospace,monospace;color:var(--muted)}
.tn .pg{font-size:11px;color:var(--muted);white-space:nowrap}
.tn .tg{width:12px;color:var(--muted);flex:none}
.tn .sum{font-size:12px;color:var(--muted);margin:2px 0 4px 34px;display:none}
.tn.open>.sum{display:block}
.tn .kids{margin-left:14px;border-left:1px dashed var(--line);padding-left:4px}
.tn.fold>.kids{display:none}
.q{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.q textarea{flex:1 1 100%;min-height:56px;resize:vertical;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.ans{white-space:pre-wrap;line-height:1.65}
.cite{display:inline-block;font:11px ui-monospace,monospace;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 4px;margin:0 1px;cursor:pointer}
.box{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:8px 0}
.box h3{font-size:12px;margin:0 0 4px;color:var(--muted);font-weight:600}
.think{font-size:12px;color:var(--muted)}
.hitn{font-size:13px;padding:3px 0;cursor:pointer}
.hitn:hover{color:var(--accent)}
.viewer img{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.meta{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:20px;text-align:center}
.tl{position:relative;padding-left:4px}
.step{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--panel);overflow:hidden}
.step .hd{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;border-bottom:1px solid transparent}
.step.open .hd{border-bottom-color:var(--line)}
.step .ic{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.step.run .ic{animation:pulse 1s ease-in-out infinite}
.step.done .ic{background:var(--accent);color:#fff}
.step.warn .ic{background:#d98a00;color:#fff}
@keyframes pulse{50%{opacity:.35}}
.step .tm{margin-left:auto;font:11px ui-monospace,monospace;color:var(--muted)}
.step .bd{padding:8px 10px;font-size:13px}
.step .bd:empty{display:none}
.sub{border-left:2px solid var(--line);padding:2px 0 6px 10px;margin:6px 0}
.sub .nm{font-weight:600;font-size:12.5px}
.badge{display:inline-block;font:11px ui-monospace,monospace;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:3px 0}
.nchip{display:inline-block;font-size:12px;background:var(--hl);border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0;cursor:pointer}
.nchip i{font-style:normal;color:var(--muted);font-size:11px}
.spin{color:var(--muted);font-size:12px}
.spin::after{content:"";display:inline-block;width:10px;height:10px;margin-left:6px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}
.caret::after{content:"▍";color:var(--accent);animation:pulse .8s infinite}
.sample{font:11.5px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf{margin-top:6px}
.wf .row{display:grid;grid-template-columns:150px 1fr 54px;gap:8px;align-items:center;font-size:11.5px;margin:3px 0}
.wf .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.wf .track{position:relative;height:14px;background:var(--bg);border-radius:3px}
.wf .seg{position:absolute;top:0;height:100%}
.wf .s-wait{background:var(--line)}.wf .s-ttft{background:#9db7f5}.wf .s-dec{background:var(--accent)}
@media (prefers-color-scheme: dark){.wf .s-ttft{background:#3c5a9e}}
.wf .num{text-align:right;font:11px ui-monospace,monospace;color:var(--muted)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.verdict{font-size:12.5px;margin-top:8px;line-height:1.6}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px 16px}
.modal.on{display:flex}
.modal .pane{background:var(--panel);border-radius:10px;max-width:900px;width:100%;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal .pane h3{margin:0 0 6px;font-size:14px;display:flex;gap:10px;align-items:center}
.modal .pane h3 .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.modal img{width:100%;border:1px solid var(--line);border-radius:4px;background:#fff}
.coll{padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.coll:hover{background:var(--accent-soft)}
.coll.sel{border-color:var(--accent);background:var(--accent-soft)}
.coll .n{font-weight:600;word-break:break-all}
.coll .m{font-size:12px;color:var(--muted)}
.fmt{display:inline-block;font:10.5px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px;margin-right:4px;text-transform:uppercase}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--accent);cursor:pointer}
.fileRow{display:flex;gap:6px;align-items:baseline;cursor:pointer;border-radius:4px;padding:2px 4px}
.fileRow:hover{background:var(--accent-soft)}
.fileRow .pg{font-size:11px;color:var(--muted);white-space:nowrap}
.dirSum{font-size:12px;color:var(--muted);margin:0 0 4px 22px}
.anc{font-size:12px;margin:3px 0;padding:3px 6px;border-radius:4px;background:var(--bg)}
.anc.r0{opacity:.55}
.anc b{font-weight:600}
.txtpage{white-space:pre-wrap;font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:4px;padding:10px 12px;max-height:70vh;overflow:auto;background:var(--bg)}
.txtpage mark{background:var(--hl);color:inherit;border-radius:2px}
select.sm{font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
button.ghost{background:var(--accent-soft);color:var(--accent)}
.ps-head{font-size:12.5px;color:var(--muted);margin:4px 0 8px;line-height:1.6}
.ps{display:grid;grid-template-columns:22px 64px 1fr;gap:10px;align-items:start;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.ps:hover{background:var(--accent-soft)}
.ps .rk{font:600 12px ui-monospace,monospace;color:var(--muted);padding-top:2px;text-align:right}
.ps .th{width:64px;height:84px;border:1px solid var(--line);border-radius:3px;background:var(--bg);object-fit:cover;object-position:top;display:flex;align-items:center;justify-content:center;font:10.5px ui-monospace,monospace;color:var(--muted);text-transform:uppercase}
.ps .nm{font-size:13px;font-weight:600;word-break:break-all}
.ps .tp{font-size:12px;color:var(--muted);margin:1px 0 3px}
.ps .sn{font-size:12px;line-height:1.5;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps .sc{display:flex;align-items:center;gap:6px;margin-top:4px;font:11px ui-monospace,monospace;color:var(--muted)}
.ps .sc .bar{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.ps .sc .bar i{display:block;height:100%;background:var(--accent)}
.modal .quote{font-size:12.5px;color:var(--muted);border-left:3px solid #f2a33a;padding:2px 8px;margin:6px 0 10px}

/* ---- zip processing view ---- */
:root{--c-vision:#008300;--c-parse:#2a78d6;--c-mineru:#eb6834;--c-tree:#1baf7a;--c-summary:#eda100;--c-embed:#e87ba4;--c-dirs:#6250d6}
@media (prefers-color-scheme: dark){:root{--c-vision:#2e9e2e;--c-parse:#3987e5;--c-mineru:#d95926;--c-tree:#199e70;--c-summary:#c98500;--c-embed:#d55181;--c-dirs:#9085e9}}
.modal .pane.wide{max-width:1120px;padding:16px 18px 18px}
.pv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pv-head .t{font-size:16px;font-weight:700}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid currentColor}
.pv-head .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;margin:4px 0 16px;counter-reset:st}
.stp{position:relative;text-align:center;padding:0 4px}
.stp::before{content:"";position:absolute;top:13px;left:-50%;right:50%;height:2px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.done::before,.stp.run::before{background:var(--accent)}
.stp .dot{position:relative;z-index:1;width:28px;height:28px;margin:0 auto 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px ui-monospace,monospace;background:var(--panel);border:2px solid var(--line);color:var(--muted)}
.stp.done .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.stp.run .dot{border-color:var(--accent);color:var(--accent)}
.stp.run .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--accent);opacity:.5;animation:ring 1.4s ease-out infinite}
.stp.bad .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes ring{from{transform:scale(.8);opacity:.6}to{transform:scale(1.25);opacity:0}}
.stp .nm{font-size:12.5px;font-weight:600}
.stp .sb{font-size:11px;color:var(--muted);min-height:16px;font-variant-numeric:tabular-nums}
.stp .bar{height:3px;border-radius:2px;background:var(--line);margin:4px 10px 0;overflow:hidden}
.stp .bar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.stp .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tile .v small{font-size:12px;color:var(--muted);font-weight:500}
.tile .k{font-size:11.5px;color:var(--muted)}
.gantt{--lab:minmax(120px,230px);--st:170px}
.g-row,.g-axis{display:grid;grid-template-columns:var(--lab) 1fr var(--st);gap:10px;align-items:center}
.g-row{min-height:26px;border-radius:4px;padding:0 4px}
.g-row:hover{background:var(--accent-soft)}
.g-row.clk{cursor:pointer}
.g-lab{display:flex;align-items:center;gap:4px;font-size:12.5px;min-width:0}
.g-lab .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-dir{font-size:11.5px;color:var(--muted);padding:8px 4px 2px;font-weight:600}
.g-track{position:relative;height:16px}
.g-track::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.g-seg{position:absolute;top:1px;height:14px;border-radius:3px;transition:left .5s linear,width .5s linear}
.g-seg.s-wait{background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px);top:4px;height:8px}
.s-vision{background:var(--c-vision)}.s-parse{background:var(--c-parse)}.s-mineru{background:var(--c-mineru)}.s-tree{background:var(--c-tree)}.s-summary{background:var(--c-summary)}.s-embed{background:var(--c-embed)}.s-dirs{background:var(--c-dirs)}
.g-seg.live{background-image:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);background-size:60px 100%;background-repeat:no-repeat;animation:sheen 1.2s linear infinite}
@keyframes sheen{from{background-position:-60px 0}to{background-position:calc(100% + 60px) 0}}
.g-st{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.g-st.ok{color:var(--ink)}.g-st.bad{color:var(--bad)}
.g-axis{margin-top:4px;padding:0 4px}
.g-ticks{position:relative;height:18px;border-top:1px solid var(--line)}
.g-ticks span{position:absolute;top:2px;transform:translateX(-50%);font:10.5px ui-monospace,monospace;color:var(--muted)}
.g-ticks span::before{content:"";position:absolute;left:50%;top:-3px;height:4px;border-left:1px solid var(--line)}
.pv-legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin:10px 0 0}
.pv-legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pv-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
#pvTip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.5;border-radius:6px;padding:6px 9px;max-width:320px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.collbar{height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.collbar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.pvbtn{background:var(--accent-soft);color:var(--accent);font-size:12px;padding:3px 10px;margin-left:8px}
@media (max-width:760px){.steps{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:12px}.stp:nth-child(6)::before{display:none}.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}.gantt{--lab:110px;--st:0px}.g-st{display:none}}
</style>
</head>
<body>
<header><h1>pidx</h1><span>PDF / 图片 / Office / Markdown / zip → 树索引 → 向量召回子树 + LLM 推理检索（不切块）</span>
  <nav><a href="./" class="on">演示</a><a href="pipeline">Pipeline</a><a href="api-docs">接口文档</a></nav></header>
<main>
  <section>
    <h2>文档 <span id="cnt"></span></h2>
    <div class="up"><input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.jp2,.webp,.gif,.bmp,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.md,.markdown,.txt,.zip">
      <div class="meta" style="margin-top:4px">PDF、图片、Word / PPT / Excel、Markdown / txt，或带目录的 zip 包</div></div>
    <div class="scroll" id="docs"></div>
  </section>
  <section>
    <h2><span id="treeTitle">树索引</span><span class="meta" id="treeMeta"></span></h2>
    <div class="scroll" id="tree"><div class="empty">选择左侧文档</div></div>
  </section>
  <section>
    <h2>检索 / 问答</h2>
    <div class="q">
      <textarea id="query" placeholder="问一个关于文档的问题…"></textarea>
      <label>范围 <select id="scope" class="sm"><option value="doc">当前文档</option><option value="coll">当前资料包</option><option value="all">全库</option></select></label>
      <label>召回 <select id="retrieval" class="sm"><option value="hybrid">向量召回子树 + LLM</option><option value="tree">纯 LLM 读树</option></select></label>
      <label><input type="checkbox" id="ans" checked> 生成答案</label>
      <label>模型 <select id="llm" class="sm"></select></label>
      <span style="flex:1"></span>
      <button id="pgo" class="ghost" title="只用 bge-m3 向量给页面打分，不调 LLM，约 0.2 秒">页面检索</button>
      <button id="go">检索</button>
    </div>
    <div class="sugg" id="sugg"></div>
    <div class="scroll" id="out"><div class="empty">答案、命中节点、引用定位会显示在这里</div></div>
  </section>
</main>
<div class="modal" id="modal"><div class="pane" id="modalPane"></div></div>
<div class="modal" id="pvModal"><div class="pane wide" id="pv"></div></div>
<div id="pvTip"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = null, docsCache = [];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

let collsCache = [], curColl = null;
const fmtBadge = d => d.format && d.format !== "pdf" ? `<span class="fmt">${esc((d.name.split(".").pop() || d.format))}</span>` : "";
const pgWord = d => d.format === "office" || d.format === "text" ? "段" : "页";

async function loadDocs() {
  const [{documents, total}, {collections}] = await Promise.all([api("v1/documents?limit=1000"), api("v1/collections")]);
  docsCache = documents; collsCache = collections;
  renderSugg();
  const standalone = documents.filter(d => !d.collectionId);
  $("#cnt").textContent = `${collections.length ? collections.length + " 个资料包 · " : ""}${total} 份文档`;
  $("#docs").innerHTML = collections.map(c => {
    const k = c.counts || {}, done = k.completed || 0, n = c.info?.files || 0;
    return `<div class="coll ${curColl===c.id && !cur ? "sel" : ""}" data-cid="${c.id}">
      <div class="n">📁 ${esc(c.name)}</div>
      <div class="m"><span class="st-${c.status}">${c.status}</span> · ${done}/${n} 个文件已索引${k.failed ? ` · <span class="st-failed">${k.failed} 失败</span>` : ""}${c.info?.skipped?.length ? ` · 跳过 ${c.info.skipped.length}` : ""}</div>${c.status === "processing" ? `<div class="collbar"><i style="width:${n ? (done + (k.failed || 0)) / n * 100 : 0}%"></i></div>` : ""}</div>`;
  }).join("") + standalone.map(d => `
    <div class="doc ${cur===d.id?"sel":""}" data-id="${d.id}">
      <div class="n">${fmtBadge(d)}${esc(d.name)}</div>
      <div class="m"><span class="st-${d.status}">${d.status}</span> · ${d.pageNum ?? "?"} ${pgWord(d)}${d.info ? " · " + d.info.nodes + " 节点 · " + d.info.method : ""}</div>
    </div>`).join("") || (collections.length ? "" : '<div class="empty">上传一个文件或 zip 包</div>');
  document.querySelectorAll(".doc").forEach(el => el.onclick = () => { curColl = null; selectDoc(el.dataset.id); });
  document.querySelectorAll(".coll").forEach(el => el.onclick = () => selectColl(el.dataset.cid));
  const busy = documents.some(d => d.status === "queued" || d.status === "processing") || collections.some(c => c.status === "processing");
  if (busy) setTimeout(loadDocs, 3000);
  if (cur && documents.find(d => d.id === cur)?.status === "completed" && !$("#tree .tn")) selectDoc(cur);
  else if (!cur && curColl && busy) selectColl(curColl, true);
}

async function selectColl(cid, quiet) {
  curColl = cid; cur = null;
  if (!quiet) { $("#scope").value = "coll"; renderSugg(); }
  document.querySelectorAll(".doc,.coll").forEach(el => el.classList.toggle("sel", el.dataset.cid === cid));
  const c = await api(`v1/collections/${cid}`);
  $("#treeTitle").textContent = "📁 " + c.name;
  $("#treeMeta").textContent = `${c.info?.files || 0} 个文件 · ${c.info?.dirs || 0} 个目录`;
  const skipped = c.info?.skipped?.length ? `<div class="box"><h3>跳过的文件</h3>${c.info.skipped.map(x => `<div class="meta">${esc(x.path)} — ${esc(x.reason)}</div>`).join("")}</div>` : "";
  const dir = (n, top) => {
    const kids = n.nodes.map(x => x.type === "dir" ? dir(x) : `<div class="tn"><div class="fileRow" data-doc="${x.doc_id}"><span class="tg">·</span>${fmtBadge({name: x.title, format: x.format})}<span>${esc(x.title)}</span><span class="pg st-${x.status}">${x.status === "completed" ? (x.pageNum ?? "") + " " + pgWord(x) : x.status}</span></div>${x.description ? `<div class="dirSum">${esc(x.description)}</div>` : ""}</div>`).join("");
    if (top) return (n.summary ? `<div class="box"><h3>资料包概要</h3>${esc(n.summary)}</div>` : "") + kids;
    return `<div class="tn"><div class="row"><span class="tg">▾</span><span>📂 ${esc(n.title)}</span></div>${n.summary ? `<div class="dirSum">${esc(n.summary)}</div>` : ""}<div class="kids">${kids}</div></div>`;
  };
  const pvLink = `<div class="box" style="display:flex;align-items:center"><span class="meta">${c.status === "processing" ? `正在处理：${c.counts?.completed || 0}/${c.info?.files || 0} 个文件已完成` : "解压、解析、建树、摘要、向量，每个文件花了多久"}</span><span style="flex:1"></span><button class="pvbtn" id="openPV">处理过程 ▸</button></div>`;
  $("#tree").innerHTML = pvLink + dir(c.tree, true) + skipped;
  $("#openPV").onclick = () => openPV(cid);
  document.querySelectorAll("#tree .row").forEach(r => r.onclick = () => r.parentElement.classList.toggle("fold"));
  document.querySelectorAll("#tree .fileRow").forEach(r => r.onclick = () => selectDoc(r.dataset.doc));
}

async function selectDoc(id) {
  cur = id;
  const d = docsCache.find(x => x.id === id);
  if (d?.collectionId) curColl = d.collectionId;
  if ($("#scope").value !== "all") $("#scope").value = "doc";
  renderSugg();
  document.querySelectorAll(".doc").forEach(el => el.classList.toggle("sel", el.dataset.id === id));
  document.querySelectorAll(".coll").forEach(el => el.classList.remove("sel"));
  $("#treeTitle").textContent = d?.name || "树索引";
  const crumb = d?.collectionId ? `<div class="crumb"><a data-back="${d.collectionId}">📁 ${esc(collsCache.find(c => c.id === d.collectionId)?.name || "资料包")}</a> / ${esc(d.relPath || d.name)}</div>` : "";
  if (d?.status !== "completed" && !d?.info) { $("#tree").innerHTML = crumb + `<div class="empty">${esc(d?.status)}… ${esc(d?.error||"")}</div>`; $("#treeMeta").textContent=""; bindCrumb(); return; }
  const t = await api(`v1/documents/${id}/tree?node_summary=true`);
  const i = d.info || {};
  $("#treeMeta").textContent = `${i.method} · ${i.nodes} 节点${i.node_vectors ? " · " + i.node_vectors + " 向量" : ""} · ${i.seconds ? Object.values(i.seconds).reduce((a,b)=>a+b,0).toFixed(0)+"s" : ""}`;
  $("#tree").innerHTML = crumb + (d.description ? `<div class="box"><h3>文档描述</h3>${esc(d.description)}</div>` : "") + t.result.map(renderNode).join("");
  bindCrumb();
  document.querySelectorAll("#tree .row").forEach(r => r.onclick = e => {
    const tn = r.parentElement;
    if (e.target.classList.contains("tg") && tn.querySelector(".kids")) tn.classList.toggle("fold");
    else { tn.classList.toggle("open"); showPage(cur, +r.dataset.page, []); }
  });
}
function bindCrumb() { document.querySelectorAll("[data-back]").forEach(a => a.onclick = () => selectColl(a.dataset.back)); }

function renderNode(n) {
  const kids = n.nodes?.length ? `<div class="kids">${n.nodes.map(renderNode).join("")}</div>` : "";
  const pg = n.start_index === n.end_index ? `p.${n.start_index}` : `p.${n.start_index}–${n.end_index}`;
  return `<div class="tn" data-node="${n.node_id}">
    <div class="row" data-page="${n.start_index}"><span class="tg">${n.nodes?.length ? "▾" : "·"}</span><span class="id">${n.node_id}</span><span>${esc(n.title)}</span><span class="pg">${pg}</span></div>
    <div class="sum">${esc(n.summary || n.prefix_summary || "")}</div>${kids}</div>`;
}

// [doc:block] tags -> clickable chips. Resolvable while streaming: doc index -> selected docs, page from the id.
let qDocs = [];
function renderAnswer(text, streaming) {
  if (streaming) text = text.replace(/\[[^\]]*$/, "");          // hide a half-written tag
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\[((\d+):p(\d+)_b\d+)\]/g, (m, tag, di, pg) => qDocs[+di - 1] ? `<span class="cite" data-tag="${tag}">p.${pg}</span>` : "");
}
function citeFromTag(tag) {
  const [di, bid] = tag.split(":");
  return {doc_id: qDocs[+di - 1]?.doc_id, block_id: bid, page: +bid.slice(1).split("_")[0]};
}
document.addEventListener("click", e => {
  const c = e.target.closest(".cite");
  if (c) {
    const x = citeFromTag(c.dataset.tag);
    const box = c.closest(".ans");
    const same = [...box.querySelectorAll(".cite")].map(el => citeFromTag(el.dataset.tag))
      .filter(y => y.doc_id === x.doc_id && y.page === x.page).map(y => y.block_id);
    const sentence = (box.textContent.split(/(?<=[.。!?！？])\s/).find(s => s.includes("p." + x.page)) || "");
    showPage(x.doc_id, x.page, [...new Set(same)], sentence);
  }
  const n = e.target.closest(".nchip");
  if (n) showPage(n.dataset.doc, +n.dataset.page, []);
});

let SUGG = {}, curWhy = "";
fetch("static/suggestions.json").then(r => r.json()).then(j => { SUGG = j; renderSugg(); });

function renderSugg() {
  const name = docsCache.find(d => d.id === cur)?.name;
  const cname = !cur && curColl ? collsCache.find(c => c.id === curColl)?.name : null;
  const mine = cname ? (SUGG["coll:" + cname] || []).map(s => ({...s, all: false, coll: true}))
                     : (SUGG[name] || []).map(s => ({...s, all: false}));
  const all = (SUGG.all || []).map(s => ({...s, all: true}));
  const list = [...mine, ...all];
  $("#sugg").style.display = list.length ? "" : "none";
  $("#sugg").innerHTML = `<div class="lbl">推荐问题（点击直接运行${mine.length ? "" : "；左侧选中演示文档会出现更多"}）</div>` +
    list.map((s, i) => `<button class="chip" data-i="${i}" title="${esc(s.why)}"><b>${esc(s.tag)}${s.all ? " · 全库" : s.coll ? " · 资料包" : ""}</b><span>${esc(s.q)}</span></button>`).join("");
  document.querySelectorAll(".chip").forEach(el => el.onclick = () => {
    const s = list[+el.dataset.i];
    $("#query").value = s.q; $("#scope").value = s.all ? "all" : s.coll ? "coll" : "doc"; curWhy = `<b>${esc(s.tag)}</b>：${esc(s.why)}`;
    run(true);
  });
}

// ---------------------------------------------------------------- live run (SSE)
let ticker = null;
const T = t => (t ?? 0).toFixed(1) + "s";
function step(id, icon, title) {
  let el = document.getElementById(id);
  if (!el) {
    $("#tl").insertAdjacentHTML("beforeend", `<div class="step run open" id="${id}"><div class="hd"><span class="ic">${icon}</span><b>${title}</b><span class="tm"></span></div><div class="bd"></div></div>`);
    el = document.getElementById(id);
    el.scrollIntoView({behavior: "smooth", block: "nearest"});
  }
  return el;
}
const finish = (el, t, cls = "done") => { el.classList.remove("run"); el.classList.add(cls); if (t !== undefined) el.querySelector(".tm").textContent = "t=" + T(t); };
const llmBadge = c => `<span class="badge">LLM · 排队+预填充 ${T(c.ttft_ms/1000)} · 生成 ${c.completion_tokens} tok / ${T(c.decode_ms/1000)}（${c.tok_per_s} tok/s）· 输入 ${c.prompt_tokens} tok</span>`;
const slug = s => s.replace(/[^\w]/g, "_");

async function run(fromChip) {
  if (fromChip !== true) curWhy = "";
  const q = $("#query").value.trim();
  if (!q) return;
  const scope = $("#scope").value;
  if (scope === "doc" && !cur) { alert("先选一个文档，或把范围改成“全库”"); return; }
  if (scope === "coll" && !curColl) { alert("先选一个资料包（zip），或把范围改成“全库”"); return; }
  $("#go").disabled = true;
  document.querySelectorAll("#tree .row.hit").forEach(el => el.classList.remove("hit"));
  $("#out").innerHTML = `${curWhy ? `<div class="why">${curWhy}</div>` : ""}<div class="tl" id="tl"></div>`;
  const t0 = performance.now();
  const head = step("st-q", "?", "问题");
  head.querySelector(".bd").textContent = q;
  ticker = setInterval(() => head.querySelector(".tm").textContent = "已用 " + T((performance.now() - t0) / 1000), 200);
  qDocs = [];
  let ansText = "", answerOn = $("#ans").checked, round = 1, libSize = 0;
  try {
    const resp = await fetch("v1/search/stream", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q, doc_ids: scope === "doc" ? [cur] : null, collection_id: scope === "coll" ? curColl : null,
        retrieval: $("#retrieval").value, answer: answerOn, top_k: 5, include_text: false, llm: $("#llm").value || null})});
    if (!resp.ok) throw new Error(await resp.text());
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, k); buf = buf.slice(k + 2);
        if (line.startsWith("data:")) onEvent(JSON.parse(line.slice(5)));
      }
    }
  } catch (e) {
    $("#tl").insertAdjacentHTML("beforeend", `<div class="empty">出错：${esc(String(e))}</div>`);
  } finally {
    clearInterval(ticker); finish(head);
    $("#go").disabled = false;
  }

  function onEvent(ev) {
    const t = ev.t;
    switch (ev.type) {
    case "start": {
      head.querySelector(".bd").innerHTML = `${esc(q)}<div class="meta">检索范围：${ev.library.length} 份文档 · 召回：${ev.retrieval === "hybrid" ? "向量召回子树 + LLM" : "纯 LLM 读树"} · 模型：${esc(ev.llm)}</div>`;
      libSize = ev.library.length;
      break; }
    case "embed": {
      const el = step("st-emb", "⋯", "向量召回：问题 → bge-m3 向量");
      el.querySelector(".bd").innerHTML = ev.ok ? `<div class="meta">${ev.ms} ms；用它给文档排序、给每棵树召回最相关的子树</div>` : `<div class="meta">向量服务不可用，退回纯 LLM 读树</div>`;
      finish(el, t, ev.ok ? "done" : "warn");
      if (libSize > 1)
        step("st-docs", "1", "选文档：按向量排序，LLM 读候选文档的描述（和资料包目录）").querySelector(".bd").innerHTML = '<div class="spin">正在读 ' + libSize + ' 份文档的描述</div><div class="llm"></div>';
      break; }
    case "llm": {
      const lab = ev.label;
      let el = lab.startsWith("选文档") ? document.getElementById("st-docs")
             : lab.startsWith("作答") ? document.getElementById("st-ans-" + round)
             : document.getElementById(`ts-${round}-${slug(lab.split(" · ")[1] || "")}`);
      if (el) (el.querySelector(".llm") || el.querySelector(".bd") || el).insertAdjacentHTML("beforeend", llmBadge(ev) + " ");
      break; }
    case "docs": {
      qDocs = ev.selected;
      if (ev.skipped) break;
      const el = step("st-docs", "1", "选文档：按向量排序，LLM 读候选文档的描述（和资料包目录）");
      el.querySelector(".spin")?.remove();
      const sl = ev.shortlist?.length && ev.shortlist[0].score !== null ? `<div class="meta">向量排序前 ${ev.shortlist.length}：${ev.shortlist.map(x => `${esc(x.name)} <i>${x.score}</i>`).join(" · ")}</div>` : "";
      el.querySelector(".bd").insertAdjacentHTML("afterbegin",
        `${sl}<div class="think">${esc(ev.thinking)}</div><div>选中：${ev.selected.map(d => `<span class="nchip">${esc(d.rel_path || d.name)}</span>`).join("")}</div>`);
      finish(el, t);
      break; }
    case "tree_search_start": {
      round = ev.round;
      const el = step("st-tree-" + round, "2", (round > 1 ? `树检索 · 第 ${round} 轮（补搜）` : "树检索") +
        (ev.mode === "hybrid" ? "：向量召回最相关的几棵子树，LLM 并行读它们的标题 + 摘要" : "：LLM 读整棵树的标题 + 摘要，推理答案在哪"));
      el.querySelector(".bd").innerHTML = ev.docs.map(n => `<div class="sub" id="ts-${round}-${slug(n)}"><div class="nm">${esc(n)}</div><div class="spin">正在阅读树索引</div><div class="llm"></div></div>`).join("");
      break; }
    case "tree_search": {
      const sub = document.getElementById(`ts-${ev.round}-${slug(ev.doc_name)}`);
      let how;
      if (ev.how?.mode === "hybrid")
        how = `全树切成 ${ev.how.anchors_total} 棵子树，召回 ${ev.how.anchors.length} 棵并行阅读：` + ev.how.anchors.map(a =>
          `<div class="anc r${a.relevance}"><b>${esc(a.label)}</b> <i class="meta">向量 ${a.score} · LLM 相关度 ${a.relevance}/3 · 选 ${a.nodes.length} 个</i></div>`).join("");
      else how = ev.how?.mode === "full" ? `整棵树 ≈${ev.how.tree_tokens} tok 一次读完` : `大树分层展开：${(ev.how?.expanded || []).join(", ") || "未展开"}`;
      sub.querySelector(".spin").outerHTML = `<div class="meta">${how}</div><div class="think" style="white-space:pre-wrap">${esc(ev.thinking)}</div>
        <div>${ev.nodes.map(n => `<span class="nchip" data-doc="${n.doc_id}" data-page="${n.start_index}">[${n.node_id}] ${esc(n.title)} <i>p.${n.start_index}–${n.end_index}</i></span>`).join("") || '<span class="meta">没有相关节点</span>'}</div>`;
      if (ev.doc_id === cur) markTree(ev.nodes.map(n => n.node_id));
      const st = document.getElementById("st-tree-" + ev.round);
      if (!st.querySelector(".spin")) finish(st, t);
      break; }
    case "read": {
      const el = step("st-read-" + round, "3", "读原文：取出命中节点的版面块，逐块打上引用标签");
      el.querySelector(".bd").innerHTML = `${ev.nodes.length} 个节点 · ${ev.blocks} 个版面块 · ≈${ev.context_tokens} tok 原文送入 LLM
        ${ev.sample.map(x => `<div class="sample">${esc(x)}</div>`).join("")}`;
      finish(el, t);
      break; }
    case "answer_start": {
      const el = step("st-ans-" + round, "4", "作答：只依据原文，逐句附引用（流式输出）");
      el.querySelector(".bd").innerHTML = `<div class="ans caret"></div><div class="llm"></div>`;
      ansText = "";
      break; }
    case "answer_delta": {
      ansText += ev.text;
      document.querySelector(`#st-ans-${round} .ans`).innerHTML = renderAnswer(ansText, true);
      break; }
    case "answer_done": {
      const el = document.getElementById("st-ans-" + round);
      const a = el.querySelector(".ans");
      a.classList.remove("caret");
      a.innerHTML = renderAnswer(ev.answer, false);
      el.querySelector(".bd").insertAdjacentHTML("beforeend",
        `<div class="meta">${ev.citations.length} 处引用 · 点 <span class="cite">p.N</span> 在原页上高亮${ev.sufficient ? "" : " · ⚠ 证据不足"}</div>`);
      finish(el, t, ev.sufficient ? "done" : "warn");
      break; }
    case "insufficient": {
      const el = step("st-miss-" + ev.round, "↻", "证据不足 → 补搜");
      el.querySelector(".bd").innerHTML = `缺：${esc(ev.missing)}<div class="meta">排除已读节点，带着"缺什么"再做一轮树检索</div>`;
      finish(el, t, "warn");
      break; }
    case "done": {
      const r = ev.result;
      if (r.error) { $("#tl").insertAdjacentHTML("beforeend", `<div class="empty">${esc(r.error)}</div>`); break; }
      if (!answerOn) {
        const el = step("st-nodes", "✓", "命中节点（未生成答案）");
        el.querySelector(".bd").innerHTML = r.nodes.map(n => `<span class="nchip" data-doc="${n.doc_id}" data-page="${n.start_index}">[${n.node_id}] ${esc(n.title)} <i>${esc(n.doc_name)} p.${n.start_index}–${n.end_index}</i></span>`).join("");
        finish(el);
      }
      const el = step("st-time", "⏱", `耗时 ${T(r.seconds)} 花在哪`);
      el.querySelector(".bd").innerHTML = waterfall(r.timing);
      finish(el);
      break; }
    case "error":
      $("#tl").insertAdjacentHTML("beforeend", `<div class="empty">出错：${esc(ev.message)}</div>`);
    }
  }
}

function markTree(ids) {
  let first = null;
  document.querySelectorAll("#tree .tn").forEach(tn => {
    if (ids.includes(tn.dataset.node)) {
      tn.querySelector(".row").classList.add("hit");
      for (let p = tn.parentElement.closest(".tn"); p; p = p.parentElement.closest(".tn")) p.classList.remove("fold");
      first = first || tn;
    }
  });
  first?.scrollIntoView({behavior: "smooth", block: "center"});
}

function waterfall(tm) {
  const total = Math.max(tm.total_s, 0.1), pct = x => (x / total * 100).toFixed(2) + "%";
  const rows = tm.calls.map(c => {
    const w = c.wait_ms / 1000, f = c.ttft_ms / 1000, d = c.decode_ms / 1000;
    return `<div class="row"><span class="lab" title="${esc(c.label)}">${esc(c.label)}</span><div class="track">
      <div class="seg s-wait" style="left:${pct(c.start)};width:${pct(w)}"></div>
      <div class="seg s-ttft" style="left:${pct(c.start + w)};width:${pct(f)}"></div>
      <div class="seg s-dec" style="left:${pct(c.start + w + f)};width:${pct(d)}"></div></div>
      <span class="num">${T(w + f + d)}</span></div>`;
  }).join("");
  const s = tm.llm_sum, busy = s.ttft_s + s.decode_s + s.wait_s;
  const thinkOut = tm.calls.filter(c => !c.label.startsWith("作答")).reduce((a, c) => a + c.completion_tokens, 0);
  const thinkDec = tm.calls.filter(c => !c.label.startsWith("作答")).reduce((a, c) => a + c.decode_ms, 0) / 1000;
  return `<div class="legend"><span><i style="background:#9db7f5"></i>排队 + 预填充（首 token 前）</span><span><i style="background:var(--accent)"></i>逐 token 生成</span></div>
    <div class="wf">${rows}</div>
    <div class="verdict">LLM 调用 ${tm.calls.length} 次（并行的会重叠）。累计：首 token 前 <b>${T(s.ttft_s)}</b>，生成 <b>${T(s.decode_s)}</b>
    （${busy ? Math.round(s.decode_s / busy * 100) : 0}% 在生成，共 ${s.completion_tokens} 个输出 token，输入 ${s.prompt_tokens} token）。
    其中选文档 / 树检索输出 ${thinkOut} token、生成用了 ${T(thinkDec)}，大部分是 LLM 写的推理说明。</div>`;
}

async function showPage(docId, page, blocks, text) {
  const d = docsCache.find(x => x.id === docId) || await api(`v1/documents/${docId}`).catch(() => null);
  const name = d?.relPath || d?.name || docId;
  const quote = text ? `<div class="quote">${esc(text.slice(0, 400))}</div>` : "";
  if (!d || d.pageImages) {
    $("#modalPane").innerHTML = `<h3>${esc(name)} · 第 ${page} 页 <a href="v1/documents/${docId}/file#page=${page}" target="_blank">打开原文件</a>
        ${blocks.length ? `<span class="meta">高亮 ${blocks.length} 个引用块</span>` : ""}<span class="x" title="关闭">×</span></h3>
      ${quote}<img src="v1/documents/${docId}/pages/${page}/image?zoom=2&highlight=${blocks.join(",")}" alt="page ${page}">`;
    $("#modal").classList.add("on");
    return;
  }
  // Office: no page image; show the virtual page's text with the cited blocks marked
  const [pg, ...bl] = await Promise.all([api(`v1/documents/${docId}/pages?pages=${page}`),
    ...blocks.map(b => api(`v1/documents/${docId}/blocks/${b}`).catch(() => null))]);
  const p = pg.pages[0] || {markdown: ""};
  let html = esc(p.markdown);
  for (const b of bl.filter(Boolean)) { const t = esc(b.text); if (t) html = html.split(t).join(`<mark>${t}</mark>`); }
  $("#modalPane").innerHTML = `<h3>${esc(name)} · ${esc(p.label || "第 " + page + " 段")} <a href="v1/documents/${docId}/file" target="_blank">下载原文件</a>
      ${blocks.length ? `<span class="meta">标出 ${blocks.length} 个引用块（Office / 文本文件没有版面坐标，显示解析出的文本）</span>` : ""}<span class="x" title="关闭">×</span></h3>
    ${quote}<div class="txtpage">${html}</div>`;
  $("#modal").classList.add("on");
}
$("#modal").onclick = e => { if (e.target.id === "modal" || e.target.classList.contains("x")) $("#modal").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").classList.remove("on"); });

$("#go").onclick = () => run();
$("#query").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) run(); });
$("#file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  e.target.value = "";
  try {
    if (f.name.toLowerCase().endsWith(".zip")) {
      uploadZip(f, fd);
    } else {
      const r = await api("v1/documents", {method: "POST", body: fd});
      cur = r.doc_id; curColl = null; loadDocs();
    }
  } catch (err) { alert("上传失败：" + err.message); }
};
fetch("v1/llm").then(r => r.json()).then(j => {
  $("#llm").innerHTML = j.backends.map(b => `<option value="${b.name}" ${b.name === j.default ? "selected" : ""}>${esc(b.label)}</option>`).join("");
});

// ---------------------------------------------------------------- zip processing view
const STG = {wait: "排队", parse: "读文本层", mineru: "MinerU 解析", vision: "图像理解", tree: "建树", summary: "节点摘要", embed: "节点向量", dirs: "目录摘要"};
const MST = {uploading: "上传到 MinerU", "waiting-file": "MinerU 等待文件", pending: "MinerU 排队中", running: "MinerU 解析中",
             converting: "MinerU 转换格式", downloading: "下载解析结果", done: "MinerU 完成"};
const RANK = {parse: 0, mineru: 0, vision: 1, tree: 2, summary: 3, embed: 4};
const pv = {cid: null, data: null, poll: null, tick: null, skew: 0, upload: null};
const dur = s => s == null ? "" : s < 10 ? s.toFixed(1) + "s" : s < 60 ? Math.round(s) + "s"
  : s < 3600 ? Math.floor(s / 60) + "m" + String(Math.floor(s % 60)).padStart(2, "0") + "s" : (s / 3600).toFixed(1) + "h";
const nowS = () => Date.now() / 1000 + pv.skew;

function openPV(cid, upload) {
  closePV(true);
  Object.assign(pv, {cid, data: null, upload: upload || null});
  $("#pvModal").classList.add("on");
  renderPV();
  if (cid) fetchPV();
  pv.tick = setInterval(() => { if (!pv.data || pv.data.status === "processing" || pv.upload && !pv.upload.done) renderPV(); }, 500);
}
function closePV(keep) {
  clearTimeout(pv.poll); clearInterval(pv.tick); pv.poll = pv.tick = null;
  if (!keep) { $("#pvModal").classList.remove("on"); pv.cid = null; pv.upload = null; }
}
async function fetchPV() {
  const cid = pv.cid;
  try {
    const d = await api(`v1/collections/${cid}/progress`);
    if (cid !== pv.cid) return;
    pv.skew = d.now - Date.now() / 1000; pv.data = d; renderPV();
    if (d.status === "processing") pv.poll = setTimeout(fetchPV, 1000);
    else loadDocs();
  } catch (e) { if (cid === pv.cid) pv.poll = setTimeout(fetchPV, 3000); }
}
$("#pvModal").onclick = e => { if (e.target.id === "pvModal" || e.target.classList.contains("x")) closePV(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#pvModal").classList.contains("on")) closePV(); });

function uploadZip(f, fd) {
  const up = {name: f.name, size: f.size, loaded: 0, t0: Date.now() / 1000};
  openPV(null, up);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "v1/collections");
  xhr.upload.onprogress = e => { up.loaded = e.loaded; renderPV(); };
  xhr.upload.onload = () => { up.loaded = up.size; up.sent = Date.now() / 1000; renderPV(); };
  xhr.onload = async () => {
    if (xhr.status >= 400) { up.error = (() => { try { return JSON.parse(xhr.responseText).detail; } catch { return xhr.responseText; } })(); renderPV(); return; }
    const r = JSON.parse(xhr.responseText);
    up.done = Date.now() / 1000;
    await loadDocs(); selectColl(r.collection_id);
    if (pv.upload === up) { pv.cid = r.collection_id; fetchPV(); }
  };
  xhr.onerror = () => { up.error = "网络错误，上传中断"; renderPV(); };
  xhr.send(fd);
}

function fileRank(f) {                     // how far a file has got: -1 waiting, 0..4 stage, 5 done
  if (f.status === "completed") return 5;
  if (f.status === "processing") return RANK[f.stage] ?? 0;
  return -1;
}

// Old documents have per-stage seconds but no timestamps: lay their stages out from 0.
function synthStages(f) {
  const s = f.seconds || {}, ocr = (f.parser || "").startsWith("mineru");
  let t = 0;
  return [["parse", s.parse], ["vision", s.vision], ["tree", s.tree], ["summary", s.summary], ["embed", s.embed]]
    .filter(([, x]) => x != null).map(([n, x]) => { const a = t; t += x; return [n === "parse" && ocr ? "mineru" : n, a, t]; });
}

function statusText(f, queuePos) {
  const d = f.detail || {}, llm = f.llm?.calls ? ` · LLM ${f.llm.calls} 次` : "";
  if (f.status === "queued") return [`排队中 · 第 ${queuePos} 位`, ""];
  if (f.status === "failed") return [`失败于${STG[(f.stages.at(-1) || [])[0]] || ""}`, "bad"];
  if (f.status === "completed") {
    const tot = f.stages.length ? f.stages.at(-1)[2] - f.stages[0][1] : Object.values(f.seconds || {}).reduce((a, b) => a + b, 0);
    return [`${f.pages ?? "?"} ${pgWord(f)} · ${f.nodes ?? "?"} 节点 · ${dur(tot)}`, "ok"];
  }
  switch (f.stage) {
    case "mineru": {
      const pg = d.pages_done ? ` ${d.pages_done}/${d.pages_total || "?"} 页` : "";
      return [(MST[d.state] || "MinerU " + (d.state || "")) + pg, ""]; }
    case "vision": return [`图像理解 ${d.done || 0}/${d.total ?? "?"} 张`, ""];
    case "tree": return [`建树 · ${d.pages ?? "?"} 页${llm}`, ""];
    case "summary": return [`摘要 ${d.done || 0}/${d.total ?? d.nodes ?? "?"} 节点`, ""];
    case "embed": return [`向量化 ${d.nodes ?? ""} 个节点`, ""];
    default: return ["读取文本层", ""];
  }
}

function renderPV() {
  const d = pv.data, up = pv.upload, el = $("#pv");
  const files = d?.files || [];
  const now = nowS(), running = !d || d.status === "processing";
  const counts = {done: files.filter(f => f.status === "completed").length, failed: files.filter(f => f.status === "failed").length};

  // ---- header
  const status = up?.error ? ["上传失败", "bad"] : !d ? ["上传中", "warn"] : d.status === "processing" ? ["处理中", "warn"]
    : d.status === "completed" ? ["已完成", "ok"] : ["失败", "bad"];
  const t0 = d ? (d.ingest?.[0] ?? d.created_at) : up?.t0;
  const allEnds = files.flatMap(f => f.stages.map(s => s[2] || now)).concat((d?.dirs_stage || []).map(s => s[2] || now));
  const tEnd = running ? now : Math.max(t0, ...allEnds);
  const startTxt = t0 ? new Date((t0 - pv.skew) * 1000).toLocaleTimeString() : "";
  let html = `<div class="pv-head"><span class="t">📁 ${esc(d?.name || up?.name || "")}</span>
    <span class="pill st-${status[1] === "ok" ? "completed" : status[1] === "bad" ? "failed" : "processing"}">${status[0]}</span>
    <span class="meta">${startTxt ? `开始于 ${startTxt} · ${running ? "已用" : "共"} ${dur(Math.max(0, tEnd - t0))}` : ""}
    ${d ? ` · 同时处理 ${d.workers} 个文件` : ""}</span><span class="x" title="关闭">×</span></div>`;

  // ---- stepper
  const N = files.length || 0;
  const stepAt = k => {                       // per-file stage k: done / active / failed counts
    let done = 0, act = 0, bad = 0;
    for (const f of files) {
      const r = fileRank(f);
      if (r > k) done++; else if (r === k && f.status === "processing") act++;
      else if (f.status === "failed" && (RANK[f.stages.at(-1)?.[0]] ?? 0) === k) bad++;
    }
    return {done, act, bad};
  };
  const steps = [];
  const upPct = up && !up.done ? Math.round(up.loaded / Math.max(up.size, 1) * 100) : 100;
  steps.push({nm: "上传", st: up?.error ? "bad" : up && !up.sent ? "run" : "done",
              sb: up && !up.sent ? `${upPct}% · ${(up.size / 2 ** 20).toFixed(1)} MB` : (d?.zip_bytes || up?.size) ? `${((d?.zip_bytes || up.size) / 2 ** 20).toFixed(1)} MB` : "", bar: up && !up.sent ? upPct : null});
  steps.push({nm: "解压 · 校验", st: up?.error && up.sent ? "bad" : d ? "done" : up?.sent ? "run" : "",
              sb: d ? `${N} 文件 · ${d.dirs} 目录${d.skipped.length ? ` · 跳过 ${d.skipped.length}` : ""}` : up?.error ? "" : up?.sent ? "解压中…" : ""});
  [["解析 / OCR", "parse"], ["图像理解", "vision"], ["建树", "tree"], ["节点摘要", "summary"], ["节点向量", "embed"]].forEach(([nm, key], k) => {
    const c = stepAt(k);
    steps.push({nm, sw: key, st: !d ? "" : c.done + c.bad === N && N ? (c.done ? "done" : "bad") : c.act ? "run" : c.done ? "run" : "",
                sb: d ? `${c.done}/${N}${c.act ? ` · 进行中 ${c.act}` : ""}${c.bad ? ` · 失败 ${c.bad}` : ""}` : "", bar: d ? c.done / Math.max(N, 1) * 100 : null});
  });
  const dl = d?.dirs_stage?.length, dd = d?.dirs_detail;
  steps.push({nm: "目录摘要", sw: "dirs", st: !d ? "" : dd ? "run" : d.status !== "processing" && dl ? "done" : d.status === "failed" ? "bad" : "",
              sb: dd ? `${dd.done || 0}/${dd.total}` : d && dl ? dur(d.dirs_stage[0][2] - d.dirs_stage[0][1]) : d ? `${d.dirs} 个目录` : ""});
  steps.push({nm: "完成", st: !d ? "" : d.status === "completed" ? "done" : d.status === "failed" ? "bad" : "",
              sb: d && d.status !== "processing" ? `${counts.done} 成功${counts.failed ? ` · ${counts.failed} 失败` : ""}` : ""});
  html += `<div class="steps">${steps.map((s, i) => `<div class="stp ${s.st}"><div class="dot">${s.st === "done" ? "✓" : s.st === "bad" ? "!" : i + 1}</div>
    <div class="nm">${s.sw ? `<span class="sw s-${s.sw === "parse" ? "parse" : s.sw}"></span>` : ""}${s.nm}</div><div class="sb">${s.sb || ""}</div>
    ${s.bar != null ? `<div class="bar"><i style="width:${s.bar}%"></i></div>` : ""}</div>`).join("")}</div>`;

  if (up?.error) { el.innerHTML = html + `<div class="empty st-failed">${esc(up.error)}</div>`; return; }
  if (!d) { el.innerHTML = html + `<div class="empty">${up?.sent ? "服务器正在解压、检查文件格式…" : "正在上传…"}</div>`; return; }

  // ---- tiles
  const sum = k => files.reduce((a, f) => a + (f[k] || 0), 0);
  const llmCalls = files.reduce((a, f) => a + (f.llm?.calls || 0), 0);
  const llmTok = files.reduce((a, f) => a + (f.llm?.prompt_tokens || 0) + (f.llm?.completion_tokens || 0), 0);
  const ocrN = files.filter(f => (f.parser || "").startsWith("mineru") || f.stages.some(s => s[0] === "mineru")).length;
  const tiles = [[`${counts.done}<small> / ${N}</small>`, "文件已完成"], [sum("pages"), "页 / 段"], [ocrN + `<small> / ${N}</small>`, "走 MinerU 的文件"],
                 [files.reduce((a, f) => a + (f.vision?.described || 0), 0), "张图被视觉模型识别"],
                 [sum("nodes"), "树节点"], [sum("vectors"), "节点向量（bge-m3）"],
                 [`${llmCalls}<small> 次 · ${(llmTok / 1000).toFixed(0)}k tok</small>`, "LLM 调用"]];
  html += `<div class="tiles">${tiles.map(([v, k]) => `<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div>`;

  // ---- gantt
  const synth = files.some(f => f.status === "completed" && !f.stages.length);
  let span, rowsOf;
  if (synth) {
    const st = files.map(synthStages);
    span = Math.max(1, ...st.map(x => x.at(-1)?.[2] || 0));
    rowsOf = i => ({wait: null, stages: st[i]});
  } else {
    span = Math.max(1, tEnd - t0);
    rowsOf = i => {
      const f = files[i], first = f.stages[0]?.[1];
      const qa = Math.max(t0, f.queued_at || t0);
      const waitEnd = first ?? (f.status === "queued" ? now : qa);
      return {wait: [qa, waitEnd], stages: f.stages.map(([n, a, b]) => [n, a - t0, (b ?? now) - t0, b == null])};
    };
  }
  const P = x => (Math.max(0, x) / span * 100).toFixed(3);
  const seg = (cls, a, b, tip, live) => `<div class="g-seg ${cls}${live ? " live" : ""}" style="left:${P(a)}%;width:max(2px,calc(${P(b - a)}% - 2px))" data-tip="${esc(tip)}"></div>`;
  let queuePos = 0, lastDir = null, rows = "";
  files.forEach((f, i) => {
    const dir = f.path.includes("/") ? f.path.slice(0, f.path.lastIndexOf("/")) : "";
    if (dir !== lastDir) { rows += dir || lastDir !== null ? `<div class="g-dir">📂 ${esc(dir || "（根目录）")}</div>` : ""; lastDir = dir; }
    if (f.status === "queued") queuePos++;
    const r = rowsOf(i), [stx, cls] = statusText(f, queuePos);
    let bars = "";
    if (r.wait && r.wait[1] - r.wait[0] > 0.2) bars += seg("s-wait", r.wait[0] - t0, r.wait[1] - t0, `排队等待 ${dur(r.wait[1] - r.wait[0])}`);
    for (const [n, a, b, live] of r.stages)
      bars += seg("s-" + n, a, b, `${STG[n] || n} · ${dur(b - a)}${live ? "（进行中）" : ""}${n === "mineru" && f.detail?.state && live ? " · " + (MST[f.detail.state] || f.detail.state) : ""}`, live);
    const ext = (f.name.split(".").pop() || "").toLowerCase();
    rows += `<div class="g-row ${f.status === "completed" ? "clk" : ""}" data-doc="${f.doc_id}" title="${esc(f.path)}${f.error ? "\n" + esc(f.error) : ""}">
      <div class="g-lab"><span class="fmt">${esc(ext)}</span><span class="nm">${esc(f.name)}</span></div>
      <div class="g-track">${bars}</div><div class="g-st ${cls}">${esc(stx)}</div></div>`;
  });
  if (!synth && d.dirs_stage?.length) {
    const [, a, b] = d.dirs_stage[0], live = b == null;
    rows += `<div class="g-dir">📁 资料包</div><div class="g-row"><div class="g-lab"><span class="nm">目录摘要（自底向上）</span></div>
      <div class="g-track">${seg("s-dirs", a - t0, (b ?? now) - t0, `目录摘要 · ${dur((b ?? now) - a)}`, live)}</div>
      <div class="g-st ${live ? "" : "ok"}">${live ? `${dd?.done || 0}/${dd?.total} 个目录` : `${d.dirs} 个目录 · ${dur(b - a)}`}</div></div>`;
  }
  const stepS = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200].find(x => span / x <= 7) || 7200;
  let ticks = "";
  for (let x = 0; x <= span + 1e-6; x += stepS) ticks += `<span style="left:${P(x)}%">${x === 0 ? "0" : dur(x)}</span>`;
  html += `<div class="gantt">${rows}<div class="g-axis"><span></span><div class="g-ticks">${ticks}</div><span></span></div></div>`;
  html += `<div class="pv-legend">${["wait", "parse", "mineru", "vision", "tree", "summary", "embed", "dirs"].map(n =>
    `<span><i class="${n === "wait" ? "" : "s-" + n}" style="${n === "wait" ? "background:repeating-linear-gradient(135deg,var(--line) 0 3px,transparent 3px 6px)" : ""}"></i>${STG[n]}</span>`).join("")}</div>`;
  const notes = [];
  if (synth) notes.push("这个资料包是在记录阶段时间戳之前索引的，所以每个文件的条形都从 0 开始，只表示各阶段耗时，看不出排队和并行。");
  else notes.push(`横轴是从解压完成起的时间。文件按 ${d.workers} 个一组并行处理；条形左边的斜纹是排队等待。点已完成的文件可以看它的树索引。`);
  if (d.skipped.length) notes.push("跳过：" + d.skipped.map(x => `${esc(x.path)}（${esc(x.reason)}）`).join("、"));
  if (d.error) notes.push(`<span class="st-failed">${esc(d.error)}</span>`);
  html += `<div class="pv-note">${notes.join("<br>")}</div>`;
  el.innerHTML = html;
  el.querySelectorAll(".g-row.clk").forEach(r => r.onclick = () => { closePV(); selectDoc(r.dataset.doc); });
}
document.addEventListener("mousemove", e => {
  const tip = $("#pvTip"), s = e.target.closest?.(".g-seg");
  if (!s) { tip.style.display = "none"; return; }
  tip.textContent = s.dataset.tip; tip.style.display = "block";
  const w = tip.offsetWidth;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - w - 8) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

// ---------------------------------------------------------------- page search (embeddings only)
async function pageSearch() {
  const q = $("#query").value.trim();
  if (!q) return;
  const scope = $("#scope").value;
  if (scope === "doc" && !cur) { alert("先选一个文档，或把范围改成“全库”"); return; }
  if (scope === "coll" && !curColl) { alert("先选一个资料包（zip），或把范围改成“全库”"); return; }
  $("#pgo").disabled = true;
  $("#out").innerHTML = '<div class="spin">向量化问题、给页面打分…</div>';
  const t0 = performance.now();
  try {
    const r = await api("v1/pages/search", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query: q, doc_ids: scope === "doc" ? [cur] : null, collection_id: scope === "coll" ? curColl : null, top_k: 10})});
    const rtt = Math.round(performance.now() - t0), tm = r.timing_ms, hits = r.results[0].pages;
    const max = Math.max(...hits.map(h => h.score), 1e-6);
    $("#out").innerHTML = `<div class="ps-head"><b>页面检索</b>（只用向量，不调 LLM）：在 ${r.documents} 份文档的 ${r.pages_searched} 页里排序，
      服务端 ${tm.total} ms（问题向量化 ${tm.embed} ms · 打分 ${tm.score} ms），往返 ${rtt} ms。
      分数 = 0.7 × 页向量相似度 + 0.3 × 所在章节节点的相似度。点一行看原页。
      ${r.documents_without_page_vectors.length ? `<br>⚠ ${r.documents_without_page_vectors.length} 份文档还没有页向量（后台补算中）` : ""}</div>` +
      hits.map((h, i) => `<div class="ps" data-doc="${h.doc_id}" data-page="${h.page}">
        <div class="rk">${i + 1}</div>
        ${h.image ? `<img class="th" loading="lazy" src="${h.image}?zoom=0.35" alt="">` : `<div class="th">${esc((h.doc_name.split(".").pop() || "").slice(0, 5))}</div>`}
        <div><div class="nm">${esc(h.rel_path || h.doc_name)} · ${esc(h.label || "p." + h.page)}</div>
        <div class="tp">${esc(h.title_path.join(" › "))}</div>
        <div class="sn">${esc(h.snippet)}</div>
        <div class="sc"><span class="bar"><i style="width:${(h.score / max * 100).toFixed(0)}%"></i></span>${h.score.toFixed(3)}
          <span>页 ${h.page_score.toFixed(3)} · 节点 ${h.node_score.toFixed(3)}</span></div></div></div>`).join("");
    document.querySelectorAll(".ps").forEach(el => el.onclick = () => showPage(el.dataset.doc, +el.dataset.page, []));
  } catch (e) {
    $("#out").innerHTML = `<div class="empty">出错：${esc(String(e.message || e))}</div>`;
  } finally { $("#pgo").disabled = false; }
}
$("#pgo").onclick = pageSearch;
loadDocs();
</script>
